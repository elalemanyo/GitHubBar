name: GitHubBar
options:
  bundleIdPrefix: de.elalemanyo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.0.3"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GitHubBar:
    type: application
    platform: macOS
    sources:
      - path: GitHubBar
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: GitHubBar/Info.plist
      properties:
        CFBundleDisplayName: GitHubBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "Your GitHub inbox in the menu bar."
        # Sparkle: the appcast is attached to every GitHub release by the release workflow.
        SUFeedURL: https://github.com/elalemanyo/GitHubBar/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        # Required for sandboxed apps; the Downloader service isn't needed because we have network.client.
        SUEnableInstallerLauncherService: true
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: true
    entitlements:
      path: GitHubBar/GitHubBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # Ad-hoc signatures have no Team ID, so the hardened runtime's library validation would refuse
        # to load the embedded Sparkle.framework. Needed until we sign with a Developer ID.
        com.apple.security.cs.disable-library-validation: true
        # Lets the sandboxed app talk to Sparkle's installer service.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - de.elalemanyo.GitHubBar-spks
          - de.elalemanyo.GitHubBar-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.elalemanyo.GitHubBar
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sparkle stays disabled without a public key, so Debug builds from Xcode never check for updates.
        SPARKLE_PUBLIC_KEY: ""
      configs:
        Release:
          # Public half of the Sparkle signing key; CI signs updates with the private half
          # (SPARKLE_PRIVATE_KEY secret, see scripts/make-appcast.sh).
          SPARKLE_PUBLIC_KEY: EE83FbrLIVz0s94n4Mav5DnmZZ4aFA/9FACzeY2sKlg=
