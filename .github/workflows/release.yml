name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building GitHubBar $VERSION (build $GITHUB_RUN_NUMBER)"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/dmg-derived/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Build DMG
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/make-dmg.sh

      - name: Checksum
        run: |
          cd "$(dirname "${{ steps.dmg.outputs.dmg }}")"
          shasum -a 256 "$(basename "${{ steps.dmg.outputs.dmg }}")" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitHubBar-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.dmg.outputs.dmg }}
            build/dmg/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: GitHubBar ${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            ${{ steps.dmg.outputs.dmg }}
            build/dmg/SHA256SUMS.txt
          body: |
            ## Install

            1. Download **GitHubBar-${{ steps.version.outputs.version }}.dmg** and drag GitHubBar to Applications.
            2. The app isn't notarized by Apple, so the first launch is blocked. Open **System Settings → Privacy & Security** and click **Open Anyway** (only once).
               Or run: `xattr -dr com.apple.quarantine /Applications/GitHubBar.app`

            Requires macOS 14 or later. Runs on Apple Silicon and Intel.
